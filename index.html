<head>

<body>

<canvas id="sky"></canvas>

<div id="balloons" aria-hidden="true"></div>

<!-- SCREEN 1: THE THRESHOLD -->
<main id="threshold" class="screen">
  <div class="threshold-inner">
    <h1 class="threshold-heading">Tonight, the world can wait.</h1>

    <button id="candle" aria-label="Light the candle">
      <svg viewBox="0 0 120 200" width="90" height="150">
        <defs>
          <radialGradient id="haloGrad" cx="50%" cy="38%" r="60%">
            <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.85"/>
            <stop offset="45%" stop-color="#ffb84d" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
